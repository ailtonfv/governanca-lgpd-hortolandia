{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Governança LGPD{% endblock %}
{% block conteudo %}
<section class="erro">
  <p class="etiqueta">Navegação protegida</p>
  <h1>{{ titulo }}</h1>
  <p>{{ mensagem }}</p>
  <p><a href="{{ url_for('central') }}{% if request.query_params.get('conta_id') and titulo != 'Conta indisponível' %}?conta_id={{ request.query_params.get('conta_id')|urlencode }}{% endif %}">Voltar à Central de Acesso</a></p>
</section>
{% endblock %}
