{% from '_identificador_pergunta.html' import codigo_pergunta %}
<button type="button" class="botao-pendencia-form1"
        data-pendencia-campo="{{ item.campo_id }}" data-pendencia-bloco="{{ item.bloco }}"
        data-pendencia-etapa="{{ item.etapa }}" data-pendencia-destino="{{ item.destino_tipo }}"
        aria-label="{{ 'Ir para' if registro.form1_integral.pode_editar else 'Consultar' }} a pergunta ou seção {{ codigo_pergunta(item.campo_id, 1) }} no Bloco {{ item.bloco }}">
  <strong>{{ codigo_pergunta(item.campo_id, 1) }}</strong> — {{ item.pergunta }}
  <span class="rotulo-destino-pendencia">{{ ('Consultar seção' if item.destino_tipo == 'secao' else 'Consultar pergunta') if not registro.form1_integral.pode_editar else ('Ir à seção relacionada' if item.destino_tipo == 'secao' else 'Ir à pergunta') }}</span>
</button>
