<header class="topo">
  <div class="identidade-institucional">
    <img class="brasao-institucional"
         src="{{ url_for('estaticos', path='/imagens/brasao-hortolandia.png') }}"
         alt="Brasão oficial do Município de Hortolândia" width="64" height="64">
    <div class="identidade-institucional-texto">
      <p class="sobretitulo">Prefeitura Municipal de Hortolândia</p>
      <p class="marca">Sistema Municipal de Governança LGPD</p>
    </div>
  </div>
  <span class="selo">Ambiente de demonstração — utilize exclusivamente dados fictícios.</span>
  {% if request.url.path.rstrip("/") != "/central" %}<a class="central-cabecalho" href="/central?conta_id={{ (conta_id or request.query_params.get('conta_id','CONTA-A1'))|urlencode }}">Central de Acesso (trocar servidor)</a>{% endif %}
</header>
